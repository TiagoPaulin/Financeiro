spring.application.name=financeiro

# A conexão com o banco vem das variáveis de ambiente SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD (RNF05).
# Nos testes, ela vem do container do Testcontainers (ADR 0007).

# O Flyway cria as tabelas, e o Hibernate só confere se as entidades batem com elas (ADR 0005)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Logs em JSON (RNF14 e ADR 0013)
logging.structured.format.console=ecs

# Só o health e o info ficam expostos no Actuator (RNF15 e ADR 0013)
management.endpoints.web.exposure.include=health,info

# Envio de métricas desligado até o Grafana existir (ADR 0013)
management.otlp.metrics.export.enabled=false
